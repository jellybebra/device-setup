name: minecraft-26-2
services:
  minecraft:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "${MC_BIND:-127.0.0.1}:${MC_PORT:-25565}:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.2"
      PAPER_BUILD: "135"
      SKIP_DOWNLOAD_DEFAULTS: "true"
      INIT_MEMORY: 1G
      MAX_MEMORY: 2304M
      LEVEL_TYPE: minecraft:normal
      MODE: survival
      DIFFICULTY: normal
      ONLINE_MODE: "false"
      ENFORCE_SECURE_PROFILE: "false"
      VIEW_DISTANCE: 12
      SIMULATION_DISTANCE: 5
      MOTD: "SquirtBoss · Survival"
      MODRINTH_PROJECTS: |
        worldedit:YFnqiUlL
        authmereloaded:fPuH4uYs
      COPY_CONFIG_DEST: /data
      RCON_CMDS_STARTUP: |-
        gamerule minecraft:command_blocks_work true
    volumes:
      - game:/data
      - ./config:/config:ro
    mem_limit: 3g
    cpus: 2
    logging:
      options:
        max-size: 10m
        max-file: "3"
volumes:
  game:
