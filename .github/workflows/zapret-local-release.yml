name: Zapret Local macOS release

on:
  push:
    tags:
      - 'zapret-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example zapret-v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zapret-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/zapret-local
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/zapret-local/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag and versions
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^zapret-v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$/.test(tag)) throw new Error('Invalid release tag');
          const version = tag.slice('zapret-v'.length);
          const pkg = JSON.parse(readFileSync('package.json'));
          const cargo = readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"$/m)?.[1];
          if ([pkg.version, cargo].some(value => value !== version)) throw new Error('Tag and application versions differ');
          JS
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$BUILD_TARGET"
      - name: Install locked build dependencies
        run: npm ci
      - name: Prepare bundled engine and helper
        run: node scripts/prepare-release.mjs --target "$BUILD_TARGET"
      - name: Prepare embedded Telegram runtime
        run: python3 telegram/build.py --target "$BUILD_TARGET"
      - name: Test embedded Telegram transport
        run: |
          python3 -m unittest discover -s telegram -p 'test_*.py'
          python3 telegram/test_bundle.py "binaries/telegram-$BUILD_TARGET/zapret-telegram"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test broker and privileged-helper logic
        run: cargo test --locked --package zapret-core --package zapret-helper
      - name: Test v2rayN routing priorities
        working-directory: .
        run: python3 -m unittest -v test_v2rayn_zapret.py
      - name: Check Rust diagnostics
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native app and sealed DMG
        run: npm run build -- --target "$BUILD_TARGET" --ui-only
      - name: Verify app dependencies and signatures
        run: |
          codesign --verify --deep --strict "dist/$BUILD_TARGET/Zapret Local.app"
          for binary in Contents/MacOS/zapret-helper Contents/Resources/telegram/zapret-telegram; do
            arches="$(/usr/bin/lipo -archs "dist/$BUILD_TARGET/Zapret Local.app/$binary")"
            [[ " $arches " == *" $BUILD_ARCH "* ]]
          done
          cd .build/dist
          shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zapret-local-release-${{ matrix.target }}
          path: |
            apps/zapret-local/.build/dist/*.dmg
            apps/zapret-local/.build/dist/flowseal-source-*.tar.gz
            apps/zapret-local/.build/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zapret-local-release-*
          path: release
      - name: Publish ready-to-install DMG
        run: |
          mkdir publish
          cp release/*/*.dmg publish/
          for archive in release/*/flowseal-source-*.tar.gz; do cp "$archive" publish/; done
          (cd publish && sha256sum *.dmg *.tar.gz > SHA256SUMS.txt)
          cat > release-notes.txt <<'NOTES'
          Zapret Local для macOS 14 и новее, Apple Silicon и Intel.

          Скачайте DMG для своего Mac: aarch64 — Apple Silicon, x86_64 — Intel. Перенесите приложение в Applications и запустите его. Прокси управляется из строки меню. Telegram-мост, Python и зависимости встроены; Python и Homebrew устанавливать не нужно.

          Эта сборка имеет локальную ad-hoc подпись, без Developer ID и нотарификации Apple. При первом открытии macOS может потребовать «Открыть всё равно» в разделе «Конфиденциальность и безопасность». Сетевой помощник устанавливается с отдельным системным подтверждением администратора.

          SHA256SUMS.txt содержит контрольные суммы; исходники включённого движка приложены отдельным архивом.
          NOTES
          gh release create "$RELEASE_TAG" publish/* --verify-tag \
            --title "Zapret Local ${RELEASE_TAG#zapret-v}" --notes-file release-notes.txt
